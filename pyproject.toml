[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zulip-publisher"
version = "0.1.0"
description = "Publish Zulip #blog topics to a website and Telegram"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "pillow>=10",
    "zulip>=0.9",
    "requests>=2.28",
]

[project.scripts]
"zulip-publisher" = "zulip_publisher.__main__:main"

[tool.setuptools]
packages = ["zulip_publisher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
