# Declares the secrets zulip-publisher needs -- NOT their values.
# Safe to commit. See https://secretspec.dev.
[project]
name = "zulip-publisher"
revision = "1.0"

[profiles.default]
ZULIP_URL            = { description = "Zulip server base URL", required = true }
ZULIP_API_KEY        = { description = "Zulip bot API key", required = true }
ZULIP_API_USERNAME   = { description = "Zulip bot email address", default = "zulip-publisher@example.com" }
PREPARE_URL          = { description = "Preparation interface base URL", required = true }
PREPARE_TOKEN        = { description = "Bearer token for the preparation interface", required = true }
R2_ACCESS_KEY_ID     = { description = "Cloudflare R2 access key id", required = true }
R2_SECRET_ACCESS_KEY = { description = "Cloudflare R2 secret access key", required = true }
PUSH_TOKEN           = { description = "GitHub PAT (contents:write on the site + Telegram repos) for HTTPS push from the sandbox", required = false }
